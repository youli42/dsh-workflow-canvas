name: Bug 反馈 / Bug Report
description: 反馈插件异常、界面错位或执行问题 / Report a bug, UI glitch, or execution issue
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈！请尽量补充版本信息与复现步骤，方便快速定位。 / Thanks for reporting! Please share your environment and repro steps.
  - type: input
    id: versions
    attributes:
      label: 版本信息 / Versions
      description: DSH 版本与 dsh-workflow-canvas 版本（如 DSH 0.2.2 / Plugin 1.4.0）
      placeholder: "DSH 0.2.2, dsh-workflow-canvas 1.4.0, Windows / macOS"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述与复现步骤 / Description & Steps to Reproduce
      description: 描述发生了什么、预期行为是什么，以及如何复现。
      placeholder: |
        1. 打开 Workflow 画布并……
        2. 预期：……
        3. 实际：……
    validations:
      required: true
  - type: textarea
    id: canvas_json
    attributes:
      label: 画布 JSON 或截图（可选） / Canvas JSON or Screenshots (optional)
      description: 可通过画布右上角 `⋯ → ⇧ 复制 JSON` 粘贴脱敏后的画布结构，或直接拖入截图。
      render: json
    validations:
      required: false
