name: 功能建议 / Feature Request
description: 提出新功能想法或交互体验改进 / Suggest a new feature or UX improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与痛点 / Use Case & Problem
      description: 你在什么工作流场景下遇到了不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案 / Proposed Solution
      description: 你希望画布或执行器如何工作？可附上草图或参考案例。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充说明（可选） / Additional Context (optional)
    validations:
      required: false
